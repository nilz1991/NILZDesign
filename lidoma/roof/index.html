function whenReady(image){return new Promise((ok,no)=>{const done=()=>Promise.race([image.decode?image.decode().catch(()=>{}):0,new Promise(r=>setTimeout(r,1200))]).then(ok);if(image.complete&&image.naturalWidth)done();else{image.addEventListener('load',done,{once:true});image.addEventListener('error',no,{once:true})}})}
function upload(unit,image){gl.bindTexture(gl.TEXTURE_2D,units[unit]);let source=image;const limit=gl.getParameter(gl.MAX_TEXTURE_SIZE);if(image.width>limit){source=document.createElement('canvas');source.width=limit;source.height=Math.round(limit*image.height/image.width);source.getContext('2d').drawImage(image,0,0,source.width,source.height)}gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,source)}
function setPins(scene){$('pins').replaceChildren();pins=scene.links.map(link=>{const target=sceneOf(link.to),button=document.createElement('button');button.className='pin';button.setAttribute('aria-label','Walk to '+target.label);const circle=document.createElement('span');circle.className='circle';const label=document.createElement('span');label.className='label';label.textContent=target.label;button.append(circle,label);button.onclick=()=>go(link.to,link);$('pins').append(button);return{...link,button}})}
function arrive(scene){current=scene;$('roomName').textContent=scene.label;for(const [key,button]of Object.entries(navButtons))button.setAttribute('aria-current',String(key===scene.id));setPins(scene);document.body.dataset.scene=scene.id;document.body.dataset.mode=mode;writeHash();$('status').textContent=scene.label+', '+modeInfo(mode).label+' is ready';idlePreload(scene)}
function writeHash(){const h='#'+current.id+(mode===DATA.modes[0].id?'':'-'+mode)+(!FLOORS.length||floor===FLOORS[0].id?'':'-'+floor);if(location.hash!==h)history.replaceState(null,'',h)}
function idlePreload(scene){const later=()=>{for(const m of DATA.modes)if(m.id!==mode)imageFor(scene,m.id);for(const f of FLOORS)if(f.id!==floor)imageFor(scene,mode,f.id)};if(window.requestIdleCallback)requestIdleCallback(later,{timeout:2500});else setTimeout(later,800)}
function setModeButtons(){for(const m of DATA.modes)$('mode'+m.label).setAttribute('aria-pressed',String(m.id===mode));for(const f of FLOORS)floorButtons[f.id].setAttribute('aria-pressed',String(f.id===floor));$('floorName').textContent=(FLOORS.find(f=>f.id===floor)||{label:''}).label;document.body.dataset.floor=floor}
function menu(open){$('rooms').hidden=!open;$('spaces').setAttribute('aria-expanded',String(open));if(open&&current)navButtons[current.id].focus({preventScroll:true})}
function toast(text){hideHint();const el=$('toast');el.textContent=text;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2200)}
function hideHint(){$('hint').classList.add('off')}
function loading(on,soft){const el=$('loading');el.classList.toggle('off',!on);el.classList.toggle('soft',!!soft)}
function startFade(scene,kind,ms){bindUnits();fade={t0:0,ms:calm?1:ms,scene,kind,e:0,p0:pitch,yawB:kind==='jump'?(scene.initialYaw||0)*rad:yaw};dirty=true}
function settle(){clearTimeout(slowTimer);busy=false;document.body.classList.remove('moving');loading(false)}
// first image: no fade
async function first(id,m,f){const scene=sceneOf(id);mode=m;floor=f;setModeButtons();loading(true);try{const image=imageFor(scene,m);await whenReady(image);gl.activeTexture(gl.TEXTURE0);upload(shown,image);bindUnits();yaw=(scene.initialYaw||0)*rad;pitch=LEVEL;ready=true;dirty=true;arrive(scene);loading(false);document.body.dataset.ready='true'}catch(e){fail('This space could not be loaded. Please reload the page.')}}
// walking: turn towards the marker, then a forward cross-zoom into the next point; the heading carries on, as in a real walk
function turnTo(y,p){return new Promise(done=>{const d=Math.atan2(Math.sin(y-yaw),Math.cos(y-yaw));turn={t0:0,ms:clamp(Math.abs(d)/1.9*1000,260,900),y0:yaw,dy:d,p0:pitch,dp:p-pitch,done};dirty=true})}
async function go(id,link){if(!ready||busy||(current&&current.id===id))return;const scene=sceneOf(id),serial=++pending;busy=true;document.body.classList.add('moving');vy=vp=0;$('status').textContent='Loading '+scene.label;if(!link&&current)link=current.links.find(l=>l.to===id)||null;const image=imageFor(scene,mode);slowTimer=setTimeout(()=>loading(true,true),260);if(link&&!calm)await turnTo(link.yaw*rad,clamp(link.pitch*rad,-.35,.12));try{await whenReady(image)}catch(e){settle();fail('This space could not be loaded. Please reload the page.');return}if(serial!==pending){settle();return}clearTimeout(slowTimer);loading(false);upload(1-shown,image);startFade(scene,link?'walk':'jump',link?680:520)}
// day <-> dusk or another floor at the same spot, same view
async function change(m,f){if(!ready||busy||(m===mode&&f===floor))return;const scene=current,serial=++pending;mode=m;floor=f;setModeButtons();busy=true;$('status').textContent='Changing the view';const image=imageFor(scene,m,f);slowTimer=setTimeout(()=>loading(true,true),260);try{await whenReady(image)}catch(e){settle();fail('This view could not be loaded. Please reload the page.');return}if(serial!==pending){settle();return}clearTimeout(slowTimer);loading(false);upload(1-shown,image);startFade(scene,'light',900)}
function frame(dt,ts){
if(turn){if(!turn.t0)turn.t0=ts;const k=clamp((ts-turn.t0)/turn.ms,0,1),e=ease(k);yaw=turn.y0+turn.dy*e;pitch=turn.p0+turn.dp*e;dirty=true;if(k>=1){const done=turn.done;turn=null;done()}}
if(fade){if(!fade.t0)fade.t0=ts;const k=clamp((ts-fade.t0)/fade.ms,0,1),e=ease(k);fade.e=e;gl.uniform1f(uniform.blend,e);if(fade.kind==='walk')pitch=fade.p0+(LEVEL-fade.p0)*e;fade.yawB=fade.kind==='jump'?fade.yawB:yaw;dirty=true;if(k>=1){shown=1-shown;bindUnits();gl.uniform1f(uniform.blend,0);const f=fade;fade=null;if(f.kind==='jump'){yaw=f.yawB;pitch=LEVEL}if(f.kind==='light'){document.body.dataset.mode=mode;writeHash();$('status').textContent=f.scene.label+', '+modeInfo(mode).label+' is ready';idlePreload(f.scene)}else arrive(f.scene);settle()}}
// glide after the finger leaves, smooth to a stop; the same speed on any screen rate
if(!pointers.size&&!keys.size&&!calm&&!turn&&(vy||vp)){const f=Math.exp(-dt/TAU);const g=TAU*(1-f);yaw+=vy*g;const np=pitch+vp*g;pitch=clamp(np,-PITCH_MAX,PITCH_MAX);if(pitch!==np)vp=0;vy*=f;vp*=f;if(Math.hypot(vy,vp)<STOP)vy=vp=0;dirty=true}
// arrow keys: the speed builds up and falls away
if(keys.size&&!turn){const k=1-Math.exp(-dt/140),dy=keys.has('ArrowRight')-keys.has('ArrowLeft'),dp=keys.has('ArrowUp')-keys.has('ArrowDown');vy+=(dy*.0013-vy)*k;vp+=(dp*.0009-vp)*k;yaw+=vy*dt;pitch=clamp(pitch+vp*dt,-PITCH_MAX,PITCH_MAX);dirty=true}
// zoom glides to its goal
if(Math.abs(fovGoal-fov)>.01){fov+=(fovGoal-fov)*(1-Math.exp(-dt/(calm?1:110)));dirty=true}else fov=fovGoal}
function draw(ts){ts=ts||0;const dt=Math.min(64,Math.max(0,ts-lastT));lastT=ts;frame(dt,ts);if(ready&&dirty){dirty=false;document.body.dataset.yaw=String(yaw);document.body.dataset.pitch=String(pitch);document.body.dataset.fov=String(fov);const ratio=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*ratio),h=Math.round(innerHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}const aspect=w/h,tan=Math.tan(fov*rad/2);let ta=tan,tb=tan;if(fade&&fade.kind==='walk'){const e=fade.e;ta=tan*(1-.28*e);tb=tan*(1.16-.16*e)}gl.viewport(0,0,w,h);gl.uniform1f(uniform.yaw,yaw);gl.uniform1f(uniform.yawB,fade?fade.yawB:yaw);gl.uniform1f(uniform.pitch,pitch);gl.uniform1f(uniform.aspect,aspect);gl.uniform1f(uniform.tanA,ta);gl.uniform1f(uniform.tanB,tb);gl.drawArrays(gl.TRIANGLES,0,6);
for(const pin of pins){const a=pin.yaw*rad-yaw,b=pin.pitch*rad;let x=Math.sin(a)*Math.cos(b),y=Math.sin(b),z=Math.cos(a)*Math.cos(b);const yy=Math.cos(pitch)*y-Math.sin(pitch)*z,zz=Math.sin(pitch)*y+Math.cos(pitch)*z;const sx=innerWidth*(.5+x/zz/(2*tan*aspect)),sy=innerHeight*(.5-yy/zz/(2*tan));const visible=zz>.05&&sx>25&&sx<innerWidth-25&&sy>60&&sy<innerHeight-110;pin.button.style.display=visible?'flex':'none';if(visible){pin.button.style.left=sx+'px';pin.button.style.top=sy+'px'}}}requestAnimationFrame(draw)}
// the point under the finger stays under the finger: drag scale from the real perspective, corrected for looking up or down
function dragScale(){const tan=Math.tan(fov*rad/2);return{h:2*tan/innerHeight/Math.max(Math.cos(pitch),.26),v:2*tan/innerHeight}}
function pushSample(t){samples.push({t,yaw,pitch});while(samples.length>2&&t-samples[0].t>WINDOW)samples.shift()}
canvas.addEventListener('pointerdown',e=>{vy=vp=0;samples=[];canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});prevDistance=null;canvas.focus({preventScroll:true});pushSample(e.timeStamp)});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;if(turn||(fade&&fade.kind!=='light')){pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});return}const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});document.body.classList.add('looking');hideHint();if(pointers.size===1){const s=dragScale();yaw-=(e.clientX-old.x)*s.h;pitch=clamp(pitch+(e.clientY-old.y)*s.v,-PITCH_MAX,PITCH_MAX);pushSample(e.timeStamp)}else{vy=vp=0;samples=[];const[a,b]=Array.from(pointers.values()),d=Math.hypot(a.x-b.x,a.y-b.y);if(prevDistance){fov=fovGoal=clamp(fov*prevDistance/d,FOV_MIN,FOV_MAX)}prevDistance=d}dirty=true});
function release(e){if(!pointers.has(e.pointerId))return;const was=pointers.size;pointers.delete(e.pointerId);prevDistance=null;if(!pointers.size)document.body.classList.remove('looking');if(e.type==='pointercancel'||was>1||samples.length<2){vy=vp=0;samples=[];return}const last=samples[samples.length-1],t=e.timeStamp;if(t-last.t>HOLD){vy=vp=0;samples=[];return}const first=samples[0],span=Math.max(12,last.t-first.t);vy=clamp((last.yaw-first.yaw)/span,-VMAX,VMAX);vp=clamp((last.pitch-first.pitch)/span,-VMAX*.7,VMAX*.7);samples=[];dirty=true}
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,release);
canvas.addEventListener('wheel',e=>{e.preventDefault();const step=e.deltaMode===1?e.deltaY*16:e.deltaY;fovGoal=clamp(fovGoal+step*.03,FOV_MIN,FOV_MAX);dirty=true},{passive:false});
canvas.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){keys.add(e.key);e.preventDefault()}else if(e.key==='+'||e.key==='='){fovGoal=clamp(fovGoal-6,FOV_MIN,FOV_MAX);e.preventDefault()}else if(e.key==='-'){fovGoal=clamp(fovGoal+6,FOV_MIN,FOV_MAX);e.preventDefault()}dirty=true});
canvas.addEventListener('keyup',e=>{keys.delete(e.key);if(calm&&!keys.size)vy=vp=0});canvas.addEventListener('blur',()=>{keys.clear();if(calm)vy=vp=0});
$('spaces').onclick=()=>menu($('rooms').hidden);document.addEventListener('pointerdown',e=>{if(!$('rooms').hidden&&!e.target.closest('#rooms,#spaces'))menu(false)},true);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('rooms').hidden){menu(false);$('spaces').focus()}});setTimeout(hideHint,7000);$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else $('status').textContent='For a larger view, turn your phone sideways.'}catch(e){$('status').textContent='Full screen is not available in this browser.'}};
for(const m of DATA.modes)$('mode'+m.label).onclick=()=>change(m.id,floor);
window.addEventListener('resize',()=>{dirty=true});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('The 3D view stopped. Please reload the page.')});
function parseHash(){const p=location.hash.slice(1).split('-'),f=FLOORS.find(k=>k.id===p[p.length-1]);if(f)p.pop();const m=DATA.modes.find(k=>k.id===p[p.length-1]);if(m)p.pop();return{id:p.join('-'),mode:(m||DATA.modes[0]).id,floor:(f||FLOORS[0]||{id:''}).id}}
const opening=parseHash();first((sceneOf(opening.id)||DATA.scenes[0]).id,opening.mode,opening.floor);requestAnimationFrame(draw);
window.addEventListener('hashchange',()=>{const t=parseHash();if(busy||!current||!sceneOf(t.id))return;if(current.id===t.id)change(t.mode,t.floor);else{mode=t.mode;floor=t.floor;setModeButtons();go(t.id,null)}});
}
</script></body></html>
