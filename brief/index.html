<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Al Tariq Design – Client Brief">
<meta property="og:description" content="A short questionnaire to prepare for your house design meeting.">
<title>Al Tariq Design – Client Brief</title>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1d2a30; --muted:#63727a; --line:#dcd6c8;
  --brand:#0f4c5c; --brand-ink:#ffffff; --accent:#b98a3e; --soft:#eef4f5; --on:#0f4c5c; --on-bg:#dcebee;
  --ok:#1f7a4d; --shadow:0 1px 2px rgba(20,30,35,.06),0 6px 18px rgba(20,30,35,.06);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#12191c; --card:#1b2529; --ink:#e8eef0; --muted:#9aaab1; --line:#31403f;
    --brand:#16697d; --accent:#d6a857; --soft:#223036; --on:#8fd3e2; --on-bg:#173b45; --ok:#5fd09a;
    --shadow:0 1px 2px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 "Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  padding-bottom:84px}
[dir=rtl] body{font-family:"Segoe UI","Noto Sans Arabic","Geeza Pro",Tahoma,Arial,sans-serif;line-height:1.75}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hero{background:var(--brand);color:var(--brand-ink);padding:22px 0 26px}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;
  font-weight:700;letter-spacing:.5px;color:var(--accent);flex:none;font-family:Georgia,"Times New Roman",serif}
.brand b{display:block;font-size:19px;letter-spacing:.3px}
.brand small{opacity:.8;font-size:13px}
.hero h1{font-size:23px;line-height:1.3;margin:18px 0 8px}
.hero p{margin:6px 0;opacity:.92;font-size:15px}
.hero .priv{font-size:13px;opacity:.75}
.langs{display:inline-flex;margin-top:14px;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.langs button{background:transparent;color:#fff;border:0;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
.langs button[aria-pressed=true]{background:#fff;color:var(--brand);font-weight:600}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.track{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.bar span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px 16px 8px;margin:16px 0}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:18px;line-height:1.3}
.num{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.cnt{margin-inline-start:auto;font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.cnt.done{color:var(--ok)}
.hint{color:var(--muted);font-size:13.5px;margin:2px 0 6px}
.ponly{display:none}
.q{padding:12px 0;border-top:1px solid var(--line)}
.card h2 + .q, .hint + .q{border-top:0}
.ql{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.qh{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.unit{display:flex;align-items:center;gap:8px}
.unit input{max-width:180px}
.unit span{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14.5px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;min-height:42px;cursor:pointer;text-align:start;line-height:1.35}
.chip::before{content:"";display:inline-block;width:14px;height:14px;border:1.5px solid var(--muted);border-radius:4px;
  margin-inline-end:8px;vertical-align:-2px}
.chip.r::before{border-radius:50%}
.chip[aria-pressed=true]{background:var(--on-bg);border-color:var(--on);color:var(--on);font-weight:600}
.chip[aria-pressed=true]::before{background:var(--on);border-color:var(--on);box-shadow:inset 0 0 0 2.5px var(--on-bg)}
.sp{display:grid;gap:6px}
.sprow{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px}
[dir=rtl] .sprow{padding:4px 12px 4px 4px}
.sprow.on{background:var(--on-bg);border-color:var(--on)}
.spname{flex:1;font:inherit;font-size:14.5px;color:inherit;background:none;border:0;text-align:start;padding:9px 0;cursor:pointer;min-height:40px}
.sprow.on .spname{color:var(--on);font-weight:600}
.step{display:flex;align-items:center;gap:2px;flex:none;direction:ltr}
.step button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.step output{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.send h2{margin-bottom:6px}
.btns{display:grid;gap:10px;margin:14px 0}
.btn{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:13px 16px;min-height:50px;cursor:pointer}
.btn.wa{background:#1faa59;border-color:#1faa59;color:#fff}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details{margin:10px 0 12px}
summary{cursor:pointer;color:var(--muted);font-size:14px;padding:8px 0}
#preview{min-height:220px;font-size:13px;direction:auto;white-space:pre-wrap}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:13.5px;text-decoration:underline;cursor:pointer;padding:10px 0}
.dock{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .btn{width:100%;max-width:728px;display:block;margin:0 auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1d2a30;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:14px;max-width:calc(100vw - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:8px 16px 20px}
@media (min-width:620px){ .sp{grid-template-columns:1fr 1fr} .btns.main{grid-template-columns:1fr 1fr} }
@page{size:A4;margin:12mm}
@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--muted:#444;--line:#bbb;--soft:#fff;--on-bg:#fff;--on:#000;--brand:#0f4c5c}
  body{padding:0;font-size:10.5pt;line-height:1.4}
  [dir=rtl] body{line-height:1.6}
  .bar,.dock,.toast,.langs,.send,.priv,.office,.sonly{display:none!important}
  .ponly{display:block}
  textarea{resize:none}
  .wrap{max-width:none;padding:0}
  .hero{background:none;color:#000;padding:0 0 6px;border-bottom:2px solid #0f4c5c}
  .hero h1{font-size:15pt;margin:8px 0 2px}.hero p{font-size:9.5pt;margin:2px 0}
  .mono{color:#0f4c5c;border-color:#0f4c5c;width:36px;height:36px}
  .card{box-shadow:none;border-radius:0;padding:0;margin:10px 0 0}
  .card h2{font-size:12pt;border-bottom:1px solid #000;padding-bottom:3px;break-after:avoid}
  .num{background:#0f4c5c;width:20px;height:20px;font-size:9pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cnt{display:none}
  .q{padding:5px 0;border-top:0;break-inside:avoid}
  .ql{font-size:10.5pt;margin-bottom:3px}.qh{font-size:9pt}
  input[type=text]{border:0;border-bottom:1px solid #777;border-radius:0;min-height:22px;padding:2px 0}
  textarea{border:1px solid #999;border-radius:0;min-height:44px;padding:3px}
  .chips{gap:2px 14px}
  .chip{border:0;padding:1px 0;min-height:0;font-size:10pt;font-weight:400!important}
  .chip::before{border-color:#000;box-shadow:none!important;width:10px;height:10px}
  .chip[aria-pressed=true]::before{background:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sp{grid-template-columns:1fr 1fr 1fr;gap:1px 14px}
  .sprow,[dir=rtl] .sprow{border:0;padding:0;border-bottom:1px dotted #999;border-radius:0}
  .spname{padding:1px 0;min-height:0;font-size:10pt;font-weight:400!important}
  .step button{display:none}.step output{min-width:22px;border-bottom:1px solid #000;height:15px;font-size:10pt}
  .step output.zero{color:transparent}
  footer{padding:8px 0 0}
}
</style>
</head>
<body>

<header class="hero"><div class="wrap">
  <div class="brand"><div class="mono">AT</div><div><b>Al Tariq Design</b><small id="by"></small></div></div>
  <h1 id="title"></h1>
  <p id="intro"></p>
  <p class="priv" id="priv"></p>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="en">English</button><button type="button" data-lang="ar">العربية</button><button type="button" data-lang="fa">فارسی</button>
  </div>
</div></header>

<div class="bar"><div class="wrap"><div class="track"><div class="fill" id="fill"></div></div><span id="prog"></span></div></div>

<main class="wrap">
  <div id="form"></div>

  <section class="card send" id="send">
    <h2><span class="num">✓</span><span id="sendT"></span></h2>
    <p class="hint" id="sendH"></p>
    <div class="btns main">
      <button class="btn wa" type="button" id="bWa"></button>
      <button class="btn pri" type="button" id="bShare"></button>
    </div>
    <div class="row2">
      <button class="btn" type="button" id="bCopy"></button>
      <button class="btn" type="button" id="bPrint"></button>
    </div>
    <details id="pv"><summary id="pvT"></summary><textarea id="preview" readonly dir="auto"></textarea></details>
    <button class="link" type="button" id="bClear"></button>
  </section>

  <details class="office"><summary id="offT"></summary>
    <textarea id="imp" dir="auto"></textarea>
    <div class="btns"><button class="btn" type="button" id="bImp"></button></div>
  </details>
</main>

<footer>Al Tariq Design · Muscat, Sultanate of Oman</footer>

<div class="dock"><button class="btn pri" type="button" id="bDock"></button></div>
<div class="toast" id="toast" role="status"></div>

/* ---------- state ---------- */
const KEY='atd-brief-v1', $=s=>document.querySelector(s);
const qs=new URLSearchParams(location.search);
const WA=(qs.get('wa')||OFFICE_WHATSAPP||'').replace(/\D/g,'');
let A={}, lang='en';
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
try{A=JSON.parse(store(KEY)||'{}')||{}}catch(e){A={}}
(function(){const q=qs.get('lang'), s=store(KEY+'-lang'), n=(navigator.language||'en').slice(0,2).toLowerCase();
  lang=[q,s,n].find(x=>x in LI)||'en';})();
const tr=a=>a?(a[LI[lang]]??a[0]):'';
const optL=o=>o[1+LI[lang]];
function save(){store(KEY,JSON.stringify(A));counts();}
function el(tag,attrs,kids){const e=document.createElement(tag);for(const k in (attrs||{})){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k]);}
  [].concat(kids||[]).forEach(c=>e.append(c));return e;}
function answered(q){const v=A[q.id];if(v==null)return false;if(typeof v==='string')return v.trim()!=='';if(Array.isArray(v))return v.length>0;
  return Object.values(v).some(n=>n>0);}

/* ---------- render ---------- */
function renderQ(q){
  const box=el('div',{class:'q'});
  const lab=el(q.ty==='text'||q.ty==='num'||q.ty==='area'?'label':'div',{class:'ql'},tr(q.l));
  if(q.ty==='text'||q.ty==='num'||q.ty==='area'){
    const inp=el(q.ty==='area'?'textarea':'input',{id:'f-'+q.id,dir:'auto'});
    if(q.ty!=='area'){inp.type='text';inp.setAttribute('inputmode',q.ty==='num'?'decimal':(q.im||'text'));if(q.im==='tel'||q.im==='email'||q.im==='url')inp.dir='ltr';}
    if(q.p)inp.placeholder=tr(q.p);
    inp.value=A[q.id]||'';
    inp.addEventListener('input',()=>{if(inp.value.trim())A[q.id]=inp.value;else delete A[q.id];save();});
    lab.setAttribute('for','f-'+q.id);box.append(lab);
    if(q.unit){box.append(el('div',{class:'unit'},[inp,el('span',{},U[lang][q.unit])]));}else box.append(inp);
  }else if(q.ty==='radio'||q.ty==='check'){
    box.append(lab);const chips=el('div',{class:'chips',role:'group'});
    q.o.forEach(o=>{
      const on=q.ty==='radio'?A[q.id]===o[0]:(A[q.id]||[]).includes(o[0]);
      const b=el('button',{type:'button',class:'chip'+(q.ty==='radio'?' r':''),'aria-pressed':String(on)},optL(o));
      b.addEventListener('click',()=>{
        if(q.ty==='radio'){const was=A[q.id]===o[0];chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
          if(was)delete A[q.id];else{A[q.id]=o[0];b.setAttribute('aria-pressed','true');}}
        else{const arr=A[q.id]||[];const i=arr.indexOf(o[0]);if(i<0)arr.push(o[0]);else arr.splice(i,1);
          if(arr.length)A[q.id]=arr;else delete A[q.id];b.setAttribute('aria-pressed',String(i<0));}
        save();});
      chips.append(b);});
    box.append(chips);
  }else if(q.ty==='spaces'){
    box.append(lab);const grid=el('div',{class:'sp'});
    q.o.forEach(o=>{
      const row=el('div',{class:'sprow'}),name=el('button',{type:'button',class:'spname'},optL(o)),out=el('output',{},'0');
      const minus=el('button',{type:'button','aria-label':'−'},'−'),plus=el('button',{type:'button','aria-label':'+'},'+');
      const get=()=>(A[q.id]||{})[o[0]]||0;
      const set=n=>{n=Math.max(0,Math.min(30,n));const m=A[q.id]||{};if(n)m[o[0]]=n;else delete m[o[0]];
        if(Object.keys(m).length)A[q.id]=m;else delete A[q.id];paint();save();};
      const paint=()=>{const n=get();out.textContent=n;out.className=n?'':'zero';row.classList.toggle('on',n>0);};
      name.addEventListener('click',()=>set(get()?0:1));minus.addEventListener('click',()=>set(get()-1));plus.addEventListener('click',()=>set(get()+1));
      row.append(name,el('div',{class:'step'},[minus,out,plus]));paint();grid.append(row);});
    box.append(grid);
  }
  return box;
}
function render(){
  const L=U[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';
  document.title='Al Tariq Design – '+L.title;
  $('#by').textContent=L.by;$('#title').textContent=L.title;$('#intro').textContent=L.intro;$('#priv').textContent=L.priv;
  $('#sendT').textContent=L.sendT;$('#sendH').textContent=L.sendH;$('#bWa').textContent=L.wa;$('#bShare').textContent=L.share;
  $('#bCopy').textContent=L.copy;$('#bPrint').textContent=L.print;$('#pvT').textContent=L.pv;$('#bClear').textContent=L.clear;
  $('#bDock').textContent=L.dock;$('#offT').textContent=L.off;$('#imp').placeholder=L.impPh;$('#bImp').textContent=L.imp;
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  $('#bShare').style.display=navigator.share?'':'none';
  const f=$('#form');f.innerHTML='';
  S.forEach((sec,i)=>{const card=el('section',{class:'card',id:'s-'+sec.id});
    card.append(el('h2',{},[el('span',{class:'num'},String(i+1)),el('span',{},tr(sec.t)),el('span',{class:'cnt','data-sec':sec.id})]));
    if(sec.h)card.append(el('p',{class:'hint'+(sec.hp?' sonly':'')},tr(sec.h)));if(sec.hp)card.append(el('p',{class:'hint ponly'},tr(sec.hp)));
    sec.q.forEach(q=>card.append(renderQ(q)));f.append(card);});
  counts();if($('#pv').open)$('#preview').value=buildText();
}
function counts(){let n=0,t=0;
  S.forEach(sec=>{const a=sec.q.filter(answered).length;n+=a;t+=sec.q.length;
    const c=document.querySelector('[data-sec="'+sec.id+'"]');if(c){c.textContent=a+' / '+sec.q.length;c.classList.toggle('done',a>0);}});
  $('#fill').style.width=(t?100*n/t:0)+'%';$('#prog').textContent=U[lang].prog.replace('{n}',n).replace('{t}',t);
  if($('#pv').open)$('#preview').value=buildText();}

/* ---------- output ---------- */
function b64e(s){const b=new TextEncoder().encode(s);let x='';b.forEach(c=>x+=String.fromCharCode(c));return btoa(x);}
function b64d(s){const x=atob(s);const b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return new TextDecoder().decode(b);}
function fmt(q){const v=A[q.id];if(!answered(q))return '';
  if(q.ty==='radio'){const o=q.o.find(o=>o[0]===v);return o?optL(o):'';}
  if(q.ty==='check')return q.o.filter(o=>v.includes(o[0])).map(optL).join(lang==='en'?', ':'، ');
  if(q.ty==='spaces')return q.o.filter(o=>v[o[0]]>0).map(o=>optL(o)+' ×'+v[o[0]]).join(lang==='en'?', ':'، ');
  if(q.ty==='num')return String(v).trim()+(q.unit?' '+U[lang][q.unit]:'');
  return String(v).trim();}
function buildText(){const L=U[lang];
  const d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let out='*'+L.outTitle+'*\n'+L.date+': '+ds+'\n';
  S.forEach((sec,i)=>{const lines=[];sec.q.forEach(q=>{const v=fmt(q);if(v)lines.push('• '+tr(q.l).replace(/[?؟:]\s*$/,'')+': '+v);});
    if(lines.length)out+='\n*'+(i+1)+'. '+tr(sec.t)+'*\n'+lines.join('\n')+'\n';});
  out+='\n'+L.code+'\nATD1:'+b64e(JSON.stringify({v:1,l:lang,a:A}));
  return out;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3800);}
async function copyText(txt){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);return true;}}catch(e){}
  try{const ta=el('textarea',{style:'position:fixed;top:0;left:0;opacity:0'});ta.value=txt;document.body.append(ta);ta.focus();ta.select();
    const ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}}
function ready(){if((A.name||'').trim()||(A.phone||'').trim())return true;
  if(confirm(U[lang].noName))return true;const n=$('#f-name');n.scrollIntoView({block:'center'});n.focus();return false;}
function showPreview(){$('#pv').open=true;$('#preview').value=buildText();}

document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;store(KEY+'-lang',lang);render();}));
$('#bDock').addEventListener('click',()=>$('#send').scrollIntoView({behavior:'smooth',block:'start'}));
$('#pv').addEventListener('toggle',()=>{if($('#pv').open)$('#preview').value=buildText();});
$('#bCopy').addEventListener('click',async()=>{const ok=await copyText(buildText());toast(ok?U[lang].copied:U[lang].copyFail);if(!ok)showPreview();});
$('#bPrint').addEventListener('click',()=>window.print());
$('#bShare').addEventListener('click',async()=>{if(!ready())return;try{await navigator.share({title:U[lang].outTitle,text:buildText()});}
  catch(e){if(e&&e.name!=='AbortError'){const ok=await copyText(buildText());toast(ok?U[lang].copied:U[lang].copyFail);if(!ok)showPreview();}}});
$('#bWa').addEventListener('click',async()=>{if(!ready())return;const txt=buildText();const ok=await copyText(txt);
  let url='https://wa.me/'+WA+'?text='+encodeURIComponent(txt);
  if(url.length>6000&&navigator.share){try{await navigator.share({title:U[lang].outTitle,text:txt});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  if(url.length>6000){url='https://wa.me/'+WA+'?text='+encodeURIComponent(U[lang].waShort+'\n');toast(ok?U[lang].copied:U[lang].copyFail);if(!ok){showPreview();return;}
    setTimeout(()=>{location.href=url;},1400);}
  else location.href=url;});
$('#bClear').addEventListener('click',()=>{if(confirm(U[lang].clearQ)){A={};save();render();window.scrollTo(0,0);}});
$('#bImp').addEventListener('click',()=>{const m=$('#imp').value.match(/ATD1:\s*([A-Za-z0-9+\/]+={0,2})/);
  try{if(!m)throw 0;const o=JSON.parse(b64d(m[1]));if(!o||typeof o.a!=='object')throw 0;A=o.a;save();render();toast(U[lang].impOk);window.scrollTo(0,0);}
  catch(e){toast(U[lang].impNo);}});
render();
</script>
</body>
</html>
