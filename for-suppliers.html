<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var l=new URLSearchParams(location.search).get('lang')||localStorage.getItem('nilz_lang');if(l==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';document.documentElement.classList.add('lang-ar');}}catch(e){}</script>
  <title>For Suppliers &amp; Contractors — NILZ Architecture &amp; Interior Design</title>
  <meta name="description" content="Refer design projects to NILZ in Muscat, Oman and earn commission on every signed project — interior design, 3D visualization, working drawings and site supervision.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://nilzdesign.com/for-suppliers.html">
  <meta name="theme-color" content="#1b2b4b">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NILZ">
  <meta property="og:title" content="For Suppliers &amp; Contractors — NILZ">
  <meta property="og:description" content="Bring us the project, we handle the design. Commission on every signed referral, and your products in front of the person writing the specification.">
  <meta property="og:url" content="https://nilzdesign.com/for-suppliers.html">
  <meta property="og:image" content="https://nilzdesign.com/assets/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ar_AR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="For Suppliers &amp; Contractors — NILZ">
  <meta name="twitter:description" content="Refer design projects to NILZ in Muscat, Oman and earn commission on every signed project.">
  <meta name="twitter:image" content="https://nilzdesign.com/assets/images/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@300;400;500&family=Tajawal:wght@300;400;500;700&family=El+Messiri:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=38">
  <script src="js/analytics.js" defer></script>
</head>
<body>

  <!-- ── Hero ───────────────────────────── -->
  <section class="page-hero">
    <img src="assets/images/projects/exterior/4/01.jpg" alt="" class="page-hero__bg">
    <div class="page-hero__content">
      <span class="section-tag page-hero__tag" data-cms="hero_tag">For Suppliers &amp; Contractors</span>
      <h1 class="page-hero__title display" data-cms="hero_title">Bring us the project.<br>We handle the design.</h1>
      <p class="partner-hero__sub" data-cms="hero_sub"></p>
    </div>
  </section>

  <!-- ── Intro ──────────────────────────── -->
  <section class="section section--white">
    <div class="container">
      <p class="partner-intro fade-up" data-cms="intro"></p>
    </div>
  </section>

  <!-- ── Why it's worth it ──────────────── -->
  <section class="section section--cream">
    <div class="container">
      <h2 class="section-title fade-up" data-cms="why_heading">Why it is worth your while</h2>
      <div id="supplier-why" class="partner-cards"></div>
    </div>
  </section>

  <!-- ── What we deliver ────────────────── -->
  <section class="section section--white">
    <div class="container">
      <h2 class="section-title fade-up" data-cms="deliver_heading">What we deliver on a referred project</h2>
      <div id="supplier-deliver" class="partner-steps partner-steps--four"></div>
    </div>
  </section>

  <!-- ── Referral ───────────────────────── -->
  <section class="section partner-referral">
    <div class="container partner-referral__inner">
      <h2 class="partner-referral__title" data-cms="referral_title">How the referral works</h2>
      <p class="partner-referral__body" data-cms="referral_body"></p>
      <a href="#partner-form" class="btn btn--gold" data-i18n="pform.title_suppliers">Start a partnership</a>
    </div>
  </section>

  <!-- ── Enquiry form ───────────────────── -->
  <section class="section section--white" id="partner-form">
    <div class="container partner-form-wrap">
      <h2 class="contact-form__title fade-up" data-i18n="pform.title_suppliers">Start a partnership</h2>
      <form class="contact-form fade-up" name="supplier-partnership" method="POST" action="https://formsubmit.co/info@nilzdesign.com">
        <input type="hidden" name="_next" value="https://nilzdesign.com/thank-you">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_subject" value="PARTNER ENQUIRY — Supplier / Contractor">
        <input type="hidden" name="Partner type" value="Supplier / Contractor">
        <div class="form-row">
          <div class="form-group">
            <label for="company" data-i18n="pform.company">Company name</label>
            <input type="text" id="company" name="Company" required placeholder="Your company" data-i18n-ph="pform.ph_company">
          </div>
          <div class="form-group">
            <label for="person" data-i18n="pform.contact">Contact person</label>
            <input type="text" id="person" name="Contact person" required placeholder="Full name" data-i18n-ph="pform.ph_contact">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="phone" data-i18n="pform.phone">Phone / WhatsApp</label>
            <input type="tel" id="phone" name="Phone" required placeholder="+968 9xxx xxxx">
          </div>
          <div class="form-group">
            <label for="email" data-i18n="pform.email">Email</label>
            <input type="email" id="email" name="Email" required placeholder="name@company.com">
          </div>
        </div>
        <div class="form-group">
          <label data-i18n="pform.field">Your field</label>
          <div class="form-checks">
            <label class="check-label"><input type="radio" name="Field" value="Supplier"> <span data-i18n="pform.opt_supplier">Supplier</span></label>
            <label class="check-label"><input type="radio" name="Field" value="Contractor"> <span data-i18n="pform.opt_contractor">Contractor</span></label>
            <label class="check-label"><input type="radio" name="Field" value="Both"> <span data-i18n="pform.opt_both">Both</span></label>
          </div>
        </div>
        <div class="form-group">
          <label for="message" data-i18n="pform.message">Anything else?</label>
          <textarea id="message" name="Message" rows="4" placeholder="Tell us briefly about your business..." data-i18n-ph="pform.ph_message"></textarea>
        </div>
        <button type="submit" class="btn btn--solid" style="width:100%;justify-content:center;padding:18px" data-i18n="pform.submit">Send enquiry</button>
      </form>
    </div>
  </section>

  <script type="module">
    import { initHeader } from './js/components/header.js';
    import { initFooter } from './js/components/footer.js?v=4';
    import { loadSite, renderSiteContent } from './js/content.js';
    import { init as initMain } from './js/main.js';
    import { initI18n, applyStatic, tf, onLangChange } from './js/i18n.js';

    await initI18n();
    initHeader();
    initFooter();

    async function renderSuppliers() {
      const site = await loadSite();
      const s = site.suppliers;

      document.getElementById('supplier-why').innerHTML = s.why.map(w => `
        <article class="partner-card fade-up">
          <span class="partner-card__num">${w.number}</span>
          <h3 class="partner-card__title">${tf(w, 'title')}</h3>
          <p class="partner-card__body">${tf(w, 'body')}</p>
        </article>`).join('');

      document.getElementById('supplier-deliver').innerHTML = s.deliver.map((d, i) => `
        <div class="partner-step fade-up">
          <span class="partner-step__num">${String(i + 1).padStart(2, '0')}</span>
          <h3 class="partner-step__title">${tf(d, 'title')}</h3>
          <p class="partner-step__body">${tf(d, 'body')}</p>
        </div>`).join('');

      await renderSiteContent('suppliers');
    }

    await renderSuppliers();
    onLangChange(renderSuppliers);
    applyStatic();
    initMain();
  </script>
</body>
</html>
